title      Arch Linux install medium (aarch64, UEFI, dtb kernel option)
linux      /%INSTALL_DIR%/boot/aarch64/vmlinux
initrd     /%INSTALL_DIR%/boot/aarch64/initramfs-linux.img
options    dtb=/%INSTALL_DIR%/boot/aarch64/sc8280xp-microsoft-blackrock.dtb archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% efi=noruntime pd_ignore_unused clk_ignore_unused arm64.nopauth
