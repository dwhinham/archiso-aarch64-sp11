# We include these modules to bring up the SC8280XP display pipeline during
# the initramfs stage. Without them, the framebuffer console is not available
# until after switch_root, leaving the screen blank during early boot (e.g.
# archiso hook output and copy-to-RAM progress). This is the minimal known-good
# set for the Lenovo ThinkPad X13s.

MODULES=(
    leds_qcom_lpg
    pwm_bl
    qrtr
    pmic_glink_altmode
    dispcc_sc8280xp
    panel_edp
    msm
    phy_qcom_edp
)

HOOKS=(base udev modconf kms archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
